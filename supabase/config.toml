project_id = "geotrainer-atlas"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Stripe signs webhook requests itself, so this endpoint must not require a
# Supabase JWT. Signature verification remains mandatory in the function.
[functions.stripe-webhook]
verify_jwt = false

[functions.admin-user-management]
verify_jwt = true

[functions.billing-session]
verify_jwt = true

[functions.send-collection-invite]
verify_jwt = true
